<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tareas</title>
    <link rel="stylesheet" href="./css/práctica_2.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="./js/data.js"></script>
</head>

<body>
    <div class="container my-4">
        <!--Diseño responsivo a partir de la utilización de clases de bootstrap en la barra de formulario y la de filtrado-->
        <div class="zona-superior">
            <!-- Barra superior (input, select, botón guardar) -->
            <form class="barra-formulario d-flex flex-column flex-md-row">
                <input type="text" class="form-control" placeholder="Nombre de la tarea" name="tarea">
                <select class="form-select" name="prioridad">
                    <option value="">Prioridad</option>
                    <option value="urgente">Urgente</option>
                    <option value="diaria">Diaria</option>
                    <option value="mensual">Mensual</option>
                </select>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </form>

            <!-- Barra de filtrado (filtro por prioridad y buscador) -->
            <div class="barra-filtro d-flex flex-column flex-md-row">
                <select class="form-select" id="filtro-prioridad">
                    <option value="">Filtrar por prioridad</option>
                    <option value="urgente">Urgente</option>
                    <option value="diaria">Diaria</option>
                    <option value="mensual">Mensual</option>
                </select>
                <input type="text" class="form-control" placeholder="Buscar tarea" id="buscador-tarea">
            </div>
        </div>
        <!-- Zona central para la lista de tareas -->
        <div id="listado">
            <!-- Aquí van las tareas con JS -->
        </div>

        <!-- Footer -->
        <footer>
            APP Todo´s - Alejandro
        </footer>

    </div>

    <script src="./js/práctica_2.js"></script>

</body>

</html>
